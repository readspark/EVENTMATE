<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventMate Pro - Intelligent Event Planning & Operations</title>
    <meta name="description" content="Intelligent partner for planning, organizing, and executing high-impact events. Generate Run-of-Show agendas, manage attendee check-ins, and craft promotional copy." />
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              primary: {
                DEFAULT: '#7C3AED',
                hover: '#6D28D9',
                tint: '#2E1065',
              },
              accent: '#F43F5E',
              canvas: '#000000',
              surface: '#000000',
              border: '#1F1F24',
              body: '#FFFFFF',
              muted: '#8E8E93',
              success: '#10B981',
              warning: '#F59E0B',
              error: '#EF4444',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --primary: #7C3AED;
        --primary-hover: #6D28D9;
        --primary-tint: #1E1035;
        --accent: #F43F5E;
        --bg: #040e3b;
        --surface: #040e3b;
        --border: #1F1F24;
        --text: #FFFFFF;
        --text-muted: #8E8E93;
        --success: #10B981;
        --warning: #F59E0B;
        --error: #EF4444;
      }

      body {
        background-color: #040e3b;
        color: #FFFFFF;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      html, body {
        background-color: #040e3b !important;
        color: #FFFFFF !important;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #040e3b;
        color: #FFFFFF;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Specific smooth transitions for interactive elements only (no global wildcard) */
      button, a, input, select, textarea, [role="button"] {
        transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after, button, a, input, select, textarea {
          transition-duration: 0.01ms !important;
        }
      }

      /* Custom smooth dark scrollbar */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: #040e3b;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e3a8a;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b82f6;
      }
    </style>
  </head>
  <body class="bg-[#040e3b] text-white antialiased selection:bg-[#7C3AED] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
