<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventMate Pro - Intelligent Event Planning & Operations</title>
    <meta name="description" content="Intelligent partner for planning, organizing, and executing high-impact events. Generate Run-of-Show agendas, manage attendee check-ins, and craft promotional copy." />
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontSize: {
              'xs': ['14px', { lineHeight: '20px' }],       // was 12px (+2px)
              'sm': ['16px', { lineHeight: '24px' }],       // was 14px (+2px)
              'base': ['18px', { lineHeight: '26px' }],     // was 16px (+2px)
              'lg': ['20px', { lineHeight: '28px' }],       // was 18px (+2px)
              'xl': ['22px', { lineHeight: '30px' }],       // was 20px (+2px)
              '2xl': ['26px', { lineHeight: '34px' }],      // was 24px (+2px)
              '3xl': ['32px', { lineHeight: '40px' }],      // was 30px (+2px)
              '4xl': ['38px', { lineHeight: '46px' }],      // was 36px (+2px)
              '5xl': ['50px', { lineHeight: '1' }],         // was 48px (+2px)
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              brand: {
                primary: '#047857',
                'primary-hover': '#065f46',
                secondary: '#10B981',
                accent: '#FBBF24',
                bg: '#F1F5F9',
                surface: '#FFFFFF',
                text: '#0F172A',
                muted: '#64748B',
                border: '#E2E8F0',
              },
              primary: {
                DEFAULT: '#047857',
                hover: '#065f46',
                tint: '#ECFDF5',
              },
              secondary: {
                DEFAULT: '#10B981',
                hover: '#059669',
              },
              accent: '#FBBF24',
              canvas: '#F1F5F9',
              surface: '#FFFFFF',
              border: '#E2E8F0',
              body: '#0F172A',
              muted: '#64748B',
              success: '#10B981',
              warning: '#FBBF24',
              error: '#EF4444',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-primary: #047857;
        --color-primary-hover: #065f46;
        --color-secondary: #10B981;
        --color-accent: #FBBF24;
        --color-bg: #F1F5F9;
        --color-surface: #FFFFFF;
        --color-text: #0F172A;
        --color-text-muted: #64748B;
        --color-border: #E2E8F0;
        --primary: #047857;
        --primary-hover: #065f46;
        --accent: #FBBF24;
        --bg: #F1F5F9;
        --surface: #FFFFFF;
        --border: #E2E8F0;
        --text: #0F172A;
        --text-muted: #64748B;
        --success: #10B981;
        --warning: #FBBF24;
        --error: #EF4444;
      }

      html, body {
        font-size: 18px;
        background-color: #F1F5F9 !important;
        color: #0F172A !important;
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Specific smooth transitions for interactive elements only (no global wildcard) */
      button, a, input, select, textarea, [role="button"] {
        transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after, button, a, input, select, textarea {
          transition-duration: 0.01ms !important;
        }
      }

      /* Custom smooth light scrollbar */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: #F1F5F9;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }
    </style>
  </head>
  <body class="bg-[#F1F5F9] text-[#0F172A] antialiased selection:bg-[#047857] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
